name: Temporary verify Zenodo 24273009 publication receipt
on:
  push:
    branches: [docs/zenodo-24273009-publication-receipt]
    paths: ['.github/workflows/temporary-zenodo-24273009-verify.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/zenodo-24273009-publication-receipt
      - name: Verify public Zenodo publication against current GitHub PDFs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib,datetime,urllib.request
          pubdir=Path("civilization-strategy/publication-records/02-second-age-of-intelligence")
          pubdir.mkdir(parents=True,exist_ok=True)
          sources=[
             {"language":"en","zenodo_name":"01_EN_The_Second_Age_of_Intelligence.pdf",
              "github_path":"civilization-strategy/en/pdf/02_The_Second_Age_of_Intelligence.pdf",
              "zenodo_md5_from_published_page":"c5d31306347f29c584eb12222854f79e"},
             {"language":"zh","zenodo_name":"02_ZH_Second_Age_of_Intelligence.pdf",
              "github_path":"civilization-strategy/zh/pdf/02_ZH_Second_Age_of_Intelligence.pdf",
              "zenodo_md5_from_published_page":"2c7738c8b842747b392be07f9c9c4e34"}
          ]
          checks=[]
          for item in sources:
             p=Path(item["github_path"])
             b=p.read_bytes()
             md5=hashlib.md5(b).hexdigest()
             checks.append({**item,"github_size_bytes":len(b),"github_md5":md5,
                            "github_sha256":hashlib.sha256(b).hexdigest(),
                            "same_content_as_zenodo_screenshot_md5":md5==item["zenodo_md5_from_published_page"]})
          record={"record_id":24273009,"record_url":"https://zenodo.org/records/24273009",
                  "version_doi":"10.5281/zenodo.24273009","concept_doi":"10.5281/zenodo.24273008",
                  "publication_date":"2026-11-16","declared_record_version":"1.0",
                  "title":"The Second Age of Intelligence: A Civilizational Order for Humanity and New Forms of Intelligence",
                  "file_checksums":checks,
                  "checksum_reference":"Published Zenodo page screenshots supplied by the author on 2026-11-16",
                  "checked_at_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()}
          try:
             req=urllib.request.Request("https://zenodo.org/api/records/24273009",headers={"User-Agent":"TrantorLabs-Open-Research-Archive/1.0 (public metadata)"})
             with urllib.request.urlopen(req,timeout=30) as resp: live=json.load(resp)
             selected={k:live.get(k) for k in ("id","doi","conceptdoi","created","updated","metadata","access","files") if k in live}
             (pubdir/"zenodo-api-snapshot.json").write_text(json.dumps(selected,indent=2,ensure_ascii=False)+"\n")
             record["zenodo_api_retrieved"]=True
             record["api_doi"]=live.get("doi")
             record["api_conceptdoi"]=live.get("conceptdoi")
             files=live.get("files",{})
             entries=files.get("entries",{}) if isinstance(files,dict) else files
             found=[]
             if isinstance(entries,dict):
                 for n,x in entries.items():found.append({"name":n,"size":x.get("size"),"checksum":x.get("checksum")})
             elif isinstance(entries,list):
                 for x in entries:found.append({"name":x.get("key") or x.get("filename"),"size":x.get("size"),"checksum":x.get("checksum")})
             record["api_files"]=found
          except Exception as exc:
             record["zenodo_api_retrieved"]=False
             record["zenodo_api_error"]=str(exc)[:500]
          (pubdir/"publication-verification.json").write_text(json.dumps(record,indent=2,ensure_ascii=False)+"\n")
          for c in checks:
             print("FILE",c["language"],c["github_size_bytes"],"github_md5="+c["github_md5"],
                   "published_md5="+c["zenodo_md5_from_published_page"],
                   "MATCH="+str(c["same_content_as_zenodo_screenshot_md5"]))
          print("ZENODO_API_RETRIEVED",record["zenodo_api_retrieved"])
          if not all(c["same_content_as_zenodo_screenshot_md5"] for c in checks):
             print("WARNING: Zenodo screenshots and GitHub working PDFs differ. Do not imply bitwise parity.")
          PY
      - name: Commit verification result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civilization-strategy/publication-records/02-second-age-of-intelligence/
          git diff --cached --quiet || (git commit -m "docs: archive Zenodo publication verification and public metadata" && git push origin HEAD:docs/zenodo-24273009-publication-receipt)
