name: Export civilization research PDFs (one-off)
on:
  push:
    branches: [docs/export-02-05-pdfs-20261116]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/export-02-05-pdfs-20261116
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pandoc
          python -m pip install weasyprint
      - name: Convert original Markdown to PDF
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from weasyprint import HTML
          inputs = [
              ('01-second-age-of-intelligence.md','02_The_Second_Age_of_Intelligence.pdf'),
              ('02-ai-safety-a.md','03_AI_Safety_Effective_Control_and_Accountability.pdf'),
              ('03-mindos-b.md','04_MindOS_AI_Native_Minds_and_Governable_Intelligence.pdf'),
              ('04-human-agency-c.md','05_The_Civilizational_Fork_Human_Agency.pdf'),
          ]
          basedir = Path('civilization-strategy/en')
          outdir = basedir/'pdf'
          outdir.mkdir(parents=True,exist_ok=True)
          css = """@page {size:A4; margin:15mm 16mm;} body {font-family:DejaVu Serif,Georgia,serif;font-size:10pt;line-height:1.42;color:#222;} h1,h2,h3 {font-family:DejaVu Sans,Arial,sans-serif;line-height:1.25;break-after:avoid;} h1 {font-size:17pt;} h2 {font-size:12.5pt;margin-top:14pt;} h3 {font-size:11pt;margin-top:10pt;} p {margin:0 0 7pt;orphans:2;widows:2;} a {color:#155c92;overflow-wrap:anywhere;text-decoration:none;} hr {border:0;border-top:0.5pt solid #ccc;} pre {white-space:pre-wrap;overflow-wrap:anywhere;} img {max-width:100%;} table {border-collapse:collapse;width:100%;} th,td {border:1px solid #ccc;padding:4pt;text-align:left;vertical-align:top;}"""
          for name, output in inputs:
              src = basedir/name
              md = src.read_text(encoding='utf-8')
              html = subprocess.check_output(['pandoc','-f','markdown+autolink_bare_uris','-t','html5',str(src)],text=True)
              HTML(string='<!DOCTYPE html><html lang="en"><meta charset="utf-8"><style>'+css+'</style><body>'+html+'</body></html>',base_url=str(basedir.resolve())).write_pdf(str(outdir/output))
              print(output, 'source chars=',len(md),'pdf bytes=',(outdir/output).stat().st_size)
          PY
      - name: Commit PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add civilization-strategy/en/pdf/*.pdf
          git diff --cached --quiet || (git commit -m "docs: export four complete English research PDFs" && git push origin HEAD:docs/export-02-05-pdfs-20261116)
